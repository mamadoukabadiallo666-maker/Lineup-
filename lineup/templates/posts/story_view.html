{% extends "base.html" %}
{% block content %}
<div style="background:#000;height:100vh;display:flex;align-items:center;justify-content:center;position:relative">
<a href="{% url "home" %}" style="position:absolute;top:20px;left:20px;color:#fff;font-size:30px;text-decoration:none">×</a>
<img src="{{ story.image.url }}" style="max-height:100%;max-width:100%;object-fit:contain">
<div style="position:absolute;bottom:20px;left:20px;color:#fff"><b>{{ story.user.username }}</b></div>
</div>
{% endblock %}
