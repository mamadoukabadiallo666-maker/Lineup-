{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LineUp</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" href="{% static 'img/logo.svg' %}" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="left">
        <a href="{% url 'home' %}" class="brand">
          <img src="{% static 'img/logo.svg' %}" alt="LineUp" class="brand-logo">
        </a>
      </div>
      <div class="center">
        <form action="{% url 'search' %}" method="get" class="search-form">
          <input name="q" placeholder="Rechercher" class="search-input" value="{{ request.GET.q|default:'' }}">
        </form>
      </div>
      <div class="right">
        <a href="{% url 'home' %}" class="icon" title="Accueil">🏠</a>
        <a href="{% url 'messages' %}" class="icon" title="Messages">💬</a>
        <a href="#" class="icon" title="Nouveau">➕</a>
        <a href="#" class="icon" title="Explorer">🔍</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'profile_redirect' %}" class="avatar-link">
          {% if request.user.profile.avatar %}
          <img src="{{ request.user.profile.avatar.url }}" class="avatar">
          {% else %}
          <div class="avatar placeholder">{{ request.user.username|slice:":1"|upper }}</div>
          {% endif %}
        </a>
        {% else %}
        <a href="{% url 'login' %}" class="btn-login">Connexion</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div>© {{ now|date:"Y" }} LineUp</div>
  </footer>

</body>
</html>
