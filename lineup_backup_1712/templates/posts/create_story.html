{% extends "base.html" %}
{% block content %}
<div style="background:#000;height:100vh;display:flex;flex-direction:column">
<div style="padding:12px;color:#fff">
<a href="{% url "home" %}" style="color:#fff;text-decoration:none;font-size:20px">←</a>
</div>

<form method="POST" enctype="multipart/form-data" style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px">
{% csrf_token %}
<label style="background:rgba(255,255,255,.2);padding:40px;border-radius:20px;cursor:pointer;text-align:center;color:#fff">
<svg viewBox="0 0 20 20" fill="currentColor" style="width:40px;margin:0 auto"><path d="M10 2C4.477 2 2 4.477 2 10C2 15.523 4.477 18 10 18C15.523 18 18 15.523 18 10C18 4.477 15.523 2 10 2ZM14 11H11V14C11 14.552 10.552 15 10 15C9.448 15 9 14.552 9 14V11H6C5.448 11 5 10.552 5 10C5 9.448 5.448 9 6 9H9V6C9 5.448 9.448 5 10 5C10.552 5 11 5.448 11 6V9H14C14.552 9 15 9.448 15 10C15 10.552 14.552 11 14 11Z"/></svg>
<p>Appuyez pour ajouter une photo</p>
<input type="file" name="image" accept="image/*" style="display:none">
</label>

<button type="submit" style="margin-top:20px;width:100%;background:var(--rouge);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;font-size:16px">Partager votre story</button>
</form>
</div>
{% endblock %}
