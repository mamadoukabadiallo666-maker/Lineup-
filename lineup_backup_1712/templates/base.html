<!DOCTYPE html>
<html>
<head>
<title>LINEUP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
:root{--rouge: #CE1126;--jaune: #FCD116;--vert: #009460;}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#F0F2F5}
svg{width:26px;height:26px}
.topbar{background:linear-gradient(90deg, var(--rouge) 0%, var(--jaune) 50%, var(--vert) 100%);padding:10px 12px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff; font-size:26px; font-weight:800;} 
.right-top{display:flex;gap:8px}
.top-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.nav{height:52px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-bottom:1px solid #E4E6EB}
.nav-item{position:relative;color:#65676B;width:20%;height:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.nav-item.active{color:var(--rouge);border-bottom:3px solid var(--jaune)}
.nav-item .badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--rouge);color:#fff;font-size:11px;font-weight:700;border-radius:12px;padding:1px 5px;border:2px solid #fff}
.menu-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200}
.menu{position:fixed;top:0;right:-100%;width:90%;max-width:400px;height:100%;background:#fff;z-index:201;transition:right .3s;overflow-y:auto}
.menu.show{right:0}.menu-overlay.show{display:block}
.menu-header{padding:16px;border-bottom:1px solid #E4E6EB}
.menu-profile{display:flex;align-items:center;gap:10px;text-decoration:none;color:#000}
.menu-profile img{width:56px;height:56px;border-radius:50%;border:2px solid var(--jaune)}
.menu-section{padding:12px 0;border-bottom:1px solid #E4E6EB}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 16px;text-decoration:none;color:#050505;font-weight:500}
.menu-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.create{background:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E4E6EB}
.create .avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--jaune)}
.create input{flex:1;background:#F0F2F5;border:none;border-radius:20px;padding:10px 12px;outline:none}
.stories{background:#fff;padding:12px;display:flex;gap:8px;overflow-x:auto}
.story{width:110px;height:200px;border-radius:10px;position:relative;flex-shrink:0;overflow:hidden;border:3px solid var(--jaune)}
.story img{width:100%;height:100%;object-fit:cover}
.post{background:#fff;margin-top:8px;border-top:4px solid var(--jaune)}
.post-head{padding:12px;display:flex;align-items:center;gap:10px}
.post-head .avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--jaune)}
.post-img{width:100%}
.actions{display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #E4E6EB}
.action{color:#65676B;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px}
.action svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="topbar"><div class="logo">LINEUP</div><div class="right-top"><a href="#" class="top-btn"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M14.5 10C14.5 10.28 14.28 10.5 14 10.5H10.5V14C10.5 14.28 10.28 14.5 10 14.5C9.72 14.5 9.5 14.28 9.5 14V10.5H6C5.72 10.5 5.5 10.28 5.5 10C5.5 9.72 5.72 9.5 6 9.5H9.5V6C9.5 5.72 9.72 5.5 10 5.5C10.28 5.5 10.5 5.72 10.5 6V9.5H14C14.28 9.5 14.5 9.72 14.5 10Z"/></svg></a><a href="#" class="top-btn"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 3C5.686 3 3 5.686 3 9C3 12.314 5.686 15 9 15C10.661 15 12.128 14.376 13.187 13.356L17.708 17.876C17.983 18.151 18.42 18.151 18.695 17.876C18.97 17.601 18.97 17.164 18.695 16.889L14.173 12.368C15.192 11.309 16 9.841 16 8.179C16 4.686 13.314 2 9 2ZM9 14C6.243 14 4 11.757 4 9C4 6.243 6.243 4 9 4C11.757 4 14 6.243 14 9C14 11.757 11.757 14 9 14Z"/></svg></a><div class="top-btn" onclick="toggleMenu()"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 5H17C17.552 5 18 5.448 18 6C18 6.552 17.552 7 17 7H3C2.448 7 2 6.552 2 6C2 5.448 2.448 5 3 5ZM3 10H17C17.552 10 18 10.448 18 11C18 11.552 17.552 12 17 12H3C2.448 12 2 11.552 2 11C2 10.448 2.448 10 3 10ZM3 15H17C17.552 15 18 15.448 18 16C18 16.552 17.552 17 17 17H3C2.448 17 2 16.552 2 16C2 15.448 2.448 15 3 15Z"/></svg></div></div></div>

3V14H17V13L15 11V7C15 4.243 12.757 2 10 2ZM10 19C10.552 19 11 18.552 11 18H9C9 18.552 9.448 19 10 19Z"/></svg><span class="badge">15+</span></a></div>
<div class="menu-overlay" onclick="toggleMenu()"></div>
<div class="menu" id="fbMenu"><div class="menu-header"><a href="{% url "profile_redirect" %}" class="menu-profile"><img src="{{ request.user.profile.avatar.url }}"><div><b style="font-size:18px">{{ request.user.username }}</b><br><small style="color:#65676B">Voir votre profil</small></div></a></div>

</body>
</html>
