<!DOCTYPE html><html><head><title>{{other.username}}</title><style>body{background:#f0f2f5;font-family:Arial}.header{background:#1877f2;color:white;padding:10px}.me{text-align:right;background:#0084ff;color:white;margin:5px;padding:8px;border-radius:18px;display:inline-block}.other{background:white;margin:5px;padding:8px;border-radius:18px;display:inline-block}.chat-box{position:fixed;bottom:0;width:100%;background:white;padding:10px;display:flex}</style></head><body>
<div class="header"><h2>{{other.username}}</h2></div>
<div style="padding:10px;padding-bottom:60px">
{% for m in messages %}
{% if m.sender == user %}<div style="text-align:right"><span class="me">{{m.content}}</span></div>
{% else %}<span class="other">{{m.content}}</span>{% endif %}
{% endfor %}
</div>
<form method="POST" class="chat-box">{% csrf_token %}
<input name="content" placeholder="Écrire..." style="flex:1;padding:8px;border-radius:20px;border:1px solid #ddd">
<button style="background:#1877f2;color:white;border:none;padding:8px 15px;border-radius:20px">Envoyer</button>
</form></body></html>
