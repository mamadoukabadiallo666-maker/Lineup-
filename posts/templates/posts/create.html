<!DOCTYPE html><html><head><title>Créer</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--rouge:#CE1126; --gris:#F5F5F5; --blanc:#FFFFFF} body{background:var(--gris);font-family:Arial;margin:0;padding:20px}.box{background:var(--blanc);padding:20px;border-radius:15px;border-top:5px solid var(--rouge)} textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:10px 0} .btn{background:var(--rouge);color:white;padding:12px;border:none;border-radius:8px;width:100%;font-weight:bold}</style></head><body><div class="box"><h2>📝 Créer un Post</h2><form method="POST" enctype="multipart/form-data">{% csrf_token %}<textarea name="content" rows="4" placeholder="À quoi pensez-vous?"></textarea><input type="file" name="image" accept="image/*,video/*"><button class="btn">Publier</button></form><a href="/">← Retour</a></div></body></html>
