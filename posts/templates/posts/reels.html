{% extends 'posts/home.html' %}

{% block content %}
<div class="reels-container" style="max-width: 500px; margin: 0 auto; padding: 10px;">
    <h2 style="text-align: center; color: #fff;">Reels</h2>
    
    {% for reel in reels %}
        <div class="reel-card" style="background: #000; border-radius: 10px; margin-bottom: 20px; overflow: hidden; position: relative;">
            {% if reel.video %}
                <video src="{{ reel.video.url }}" controls style="width: 100%; max-height: 80vh; display: block;"></video>
            {% else %}
                <div style="padding: 40px; text-align: center; color: #aaa; background: #222;">
                    <p>⚠️ Vidéo non disponible ou introuvable</p>
                </div>
            {% endif %}
            
            <div class="reel-info" style="padding: 10px; color: #fff; background: rgba(0,0,0,0.6);">
                <p><strong>@{{ reel.user.username }}</strong></p>
                <p>{{ reel.caption }}</p>
            </div>
        </div>
    {% empty %}
        <p style="text-align: center; color: #aaa;">Aucun reel pour le moment.</p>
    {% endfor %}
</div>
{% endblock %}
