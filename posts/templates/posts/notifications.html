<!DOCTYPE html><html><head><title>Notifications</title><style>body{background:#f0f2f5;font-family:Arial}.header{background:#1877f2;color:white;padding:10px;text-align:center}.notif{background:white;margin:5px;padding:12px;border-radius:8px;display:flex;justify-content:space-between}</style></head><body>
<div class="header"><h2>Notifications Lineup</h2></div>
{% for n in notifications %}
<div class="notif">
    <span>{{n.message}}</span>
    {% if 'demande d\'ami' in n.message %}
    <div>
        <a href="{% url 'accept_friend_request' n.id %}" style="background:green;color:white;padding:5px 10px;border-radius:5px;text-decoration:none">Accepter</a>
        <a href="{% url 'decline_friend_request' n.id %}" style="background:red;color:white;padding:5px 10px;border-radius:5px;text-decoration:none">Refuser</a>
    </div>
    {% endif %}
</div>
{% empty %}<p style="text-align:center">Aucune notification</p>{% endfor %}
</body></html>
