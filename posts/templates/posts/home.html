<!DOCTYPE html>
<html>
<head><title>LineUp</title>
<style>
body {background:#000; color:white; margin:0; font-family:sans-serif;}
.stories-bar {display:flex; gap:15px; padding:15px; overflow-x:auto; background:#000; border-bottom:1px solid #333;}
.story-circle {text-align:center; min-width:70px; color:white; font-size:12px; text-decoration:none;}
.story-circle img {width:65px; height:65px; border-radius:50%; border:3px solid #E1306C; object-fit:cover;}
.story-add {width:65px; height:65px; border-radius:50%; border:3px dashed #555; display:flex; align-items:center; justify-content:center; font-size:30px; color:#555; background:#111;}
.post {background:#111; margin:10px; padding:10px; border-radius:10px;}
</style>
</head>
<body><h1 style="color:red; font-size:50px;">TEST STORIES</h1>

<div class="stories-bar">
  <a href="{% url "create_story" %}" class="story-circle">
    <div class="story-add">+</div>
    <span>Ta story</span>
  </a>
  <a href="{% url "view_story" %}" class="story-circle">
    <img src="https://i.imgur.com/8Km9tLL.png">
    <span>Ami 1</span>
  </a>
</div>

<h2 style="padding:10px;">Feed</h2>
<div class="post">
  <p><b>Bienvenue sur LineUp</b></p>
  <p>Premier post de test</p>
</div>

</body></html>
