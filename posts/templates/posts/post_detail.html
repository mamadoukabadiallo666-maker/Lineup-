<!DOCTYPE html><html><head><title>Détail</title></head><body style="background:#f0f2f5">
<div style="max-width:600px;margin:20px auto;background:white;padding:15px">
<h3>{{post.user.username}}</h3><p>{{post.content}}</p>
<hr>
{% for c in post.comments.all %}{% if not c.parent %}
<p><b>{{c.user.username}}:</b> {{c.text}} <a href="#reply{{c.id}}">Répondre</a></p>
{% for r in c.replies.all %}<p style="margin-left:20px">↳ <b>{{r.user.username}}:</b> {{r.text}}</p>{% endfor %}
<form id="reply{{c.id}}" method="POST" action="{% url 'reply_comment' c.id %}">{% csrf_token %}<input name="text" placeholder="Répondre..."><button>Envoyer</button></form>
{% endif %}{% endfor %}
</div></body></html>
