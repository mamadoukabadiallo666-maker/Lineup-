<!DOCTYPE html><html><head><title>Amis</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--rouge:#CE1126; --gris:#F5F5F5; --blanc:#FFFFFF} body{background:var(--gris);font-family:Arial;margin:0;padding:20px} .box{background:var(--blanc);padding:15px;border-radius:12px;margin-bottom:10px} h3{border-left:4px solid var(--rouge);padding-left:10px}</style></head><body><h2>👥 Amis</h2><div class="box"><h3>Demandes reçues ({{ received.count }})</h3>{% for fr in received %}<p>{{ fr.from_user.username }}</p>{% empty %}<p>Aucune demande</p>{% endfor %}</div><div class="box"><h3>Demandes envoyées ({{ sent.count }})</h3>{% for fr in sent %}<p>À: {{ fr.to_user.username }}</p>{% empty %}<p>Aucune</p>{% endfor %}</div><a href="/">← Retour</a></body></html>
