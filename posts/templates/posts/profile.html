<!DOCTYPE html><html><head><title>{{profile_user.username}}</title><style>body{background:#f0f2f5;font-family:Arial}.cover{height:200px;background:#ccc}.avatar{width:120px;height:120px;border-radius:50%;border:4px solid white;margin-top:-60px}.btn{background:#1877f2;color:white;padding:8px 15px;border-radius:6px;text-decoration:none}</style></head><body>
<div class="cover"></div><div style="padding:15px;background:white">
<img src="{{profile_user.profile.avatar.url}}" class="avatar">
<h2>{{profile_user.username}}</h2><p>{{profile_user.profile.bio}}</p>
{% if not is_friend %}<a href="{% url 'follow_user' profile_user.username %}" class="btn">Ajouter ami</a>{% endif %}
</div>
<div style="max-width:600px;margin:10px auto">{% for post in posts %}<div style="background:white;padding:10px;margin-bottom:10px;border-radius:8px">{{post.content}}</div>{% endfor %}</div>
</body></html>
